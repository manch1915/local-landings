    level: Любой уровень
  - id: box
    name: Бокс-фитнес
    short: Бокс
    text: Удары по лапам и мешку без спаррингов. Хорошо снимает напряжение после работы.
    level: Любой уровень
  - id: trx
    name: TRX и кор
    short: TRX
    text: Тренировка в петлях TRX, планки и упражнения на мышцы, которые держат спину.
    level: Нужна базовая подготовка
  - id: stretch
    name: Стретчинг и мобилити
    short: Стретчинг
    text: Растяжка и подвижность суставов. Подойдёт и как отдельная тренировка, и как восстановление.
    level: Любой уровень

