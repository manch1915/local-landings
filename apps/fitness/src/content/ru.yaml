faq:
  - question: Подойдёт ли, если я никогда не занимался?
    answer: >-
      Да. В группе до восьми человек тренер подбирает нагрузку каждому. Новичкам
      советуем начать с функционалки или стретчинга, TRX лучше оставить на потом.
  - question: Что взять с собой?
    answer: >-
      Спортивную одежду, кроссовки с плоской подошвой и бутылку воды. Полотенце
      дадим, в раздевалках есть душ и фен.
  - question: Как записаться на занятие?
    answer: >-
      Через форму на сайте, в Telegram или по телефону. После покупки абонемента
      добавим вас в бот, там можно записываться и отменять занятия.
  - question: Можно заморозить абонемент?
    answer: >-
      Да, до 14 дней бесплатно на любом абонементе. При болезни со справкой
      заморозим на весь срок болезни.
  - question: Что если я опоздал?
    answer: >-
      Опоздание до 10 минут не страшно, разминку сделаете сами. Позже на
      функционалку и бокс не пускаем: без разминки легко травмироваться.
  - question: Есть ли парковка?
    answer: Есть бесплатная парковка во дворе на 15 машин и платная вдоль Октябрьской.

