faq:
  - question: What happens in the trial lesson?
    answer: >-
      30 minutes on Zoom. We chat a little in English, I check your level and
      explain how I'd plan your lessons. It's free with no strings attached.
  - question: Can I reschedule?
    answer: >-
      Yes, with 12 hours' notice. Later than that the lesson counts as taken,
      but once a month you can move one lesson with no conditions.
  - question: How do I pay?
    answer: >-
      Per lesson or with a monthly package at 10% off. If a package doesn't
      work out, I refund the lessons you haven't taken.
  - question: How long until I can speak?
    answer: >-
      With two lessons a week and a little homework, most students notice a
      difference in 6 to 8 weeks. Moving up a level takes 3 to 5 months.
  - question: Do you teach children under 10?
    answer: >-
      No, only from age 10. Younger kids need a different approach, and I can
      recommend a colleague.
  - question: Which time zone are you in?
    answer: >-
      Yekaterinburg, UTC+5. I have morning slots for students in Asia and
      evening slots that suit Europe.

