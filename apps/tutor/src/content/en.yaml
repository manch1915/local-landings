lessons:
  title: How lessons work
  points:
    - title: On Zoom or Google Meet
      text: You get the link 10 minutes before we start. A laptop and headphones are all you need.
    - title: You do the talking
      text: I ask questions and steer the conversation. My job is to get you speaking more than me.
    - title: Mistakes after class
      text: I don't interrupt. I note your mistakes and send a breakdown on Telegram the same evening.
    - title: 20 minutes of homework
      text: Short tasks you can do on your commute. No four-page exercises.
  correctionsTitle: What a mistake breakdown looks like
  correctionsNext: Another one
  corrections:
    - wrong: I am agree with you.
      right: I agree with you.
      note: Agree is already a verb, so am isn't needed.
    - wrong: He said me that the meeting is cancelled.
      right: He told me the meeting was cancelled.
      note: You tell someone something. After told, the tense shifts back.
    - wrong: I will call you when I will arrive.
      right: I'll call you when I arrive.
      note: After when, use the present simple for the future.
    - wrong: Can you explain me this task?
      right: Can you explain this task to me?
      note: Explain needs to before the person.

