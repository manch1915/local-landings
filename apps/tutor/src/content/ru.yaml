faq:
  - question: Как проходит пробный урок?
    answer: >-
      30 минут в Zoom. Немного поговорим на английском, я определю уровень
      и расскажу, как буду строить занятия. Это бесплатно и ни к чему не обязывает.
  - question: Можно переносить занятия?
    answer: >-
      Да, если предупредить за 12 часов. Позже урок считается проведённым,
      но один раз в месяц можно перенести без условий.
  - question: Как платить?
    answer: >-
      Поурочно или пакетом на месяц со скидкой 10%. Оплата по СБП или картой.
      Если пакет не подошёл, верну деньги за оставшиеся уроки.
  - question: Сколько нужно заниматься, чтобы заговорить?
    answer: >-
      При двух занятиях в неделю и небольшой домашке первые заметные сдвиги
      обычно через 6–8 недель. Переход на следующий уровень занимает 3–5 месяцев.
  - question: Занимаетесь с детьми младше 10 лет?
    answer: >-
      Нет, только с 10 лет. С младшими детьми нужна другая методика,
      могу посоветовать коллегу.
  - question: Можно заниматься очно?
    answer: >-
      Да, в Екатеринбурге, офис на Малышева у метро Геологическая.
      Очный урок стоит на 300 ₽ дороже.

