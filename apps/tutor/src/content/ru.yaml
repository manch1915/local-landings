lessons:
  title: Как проходят уроки
  points:
    - title: В Zoom или Google Meet
      text: Ссылка приходит за 10 минут до начала. Нужен только ноутбук и наушники.
    - title: Говорите вы
      text: Я задаю вопросы и направляю разговор. Моя задача сделать так, чтобы вы говорили больше меня.
    - title: Ошибки после урока
      text: Во время разговора не перебиваю. Ошибки записываю и присылаю разбор в Telegram в тот же вечер.
    - title: Домашка на 20 минут
      text: Короткие задания, которые можно сделать в метро. Никаких упражнений на 4 страницы.
  correctionsTitle: Так выглядит разбор ошибок
  correctionsNext: Ещё пример
  corrections:
    - wrong: I am agree with you.
      right: I agree with you.
      note: Agree уже глагол, am здесь лишний.
    - wrong: He said me that the meeting is cancelled.
      right: He told me the meeting was cancelled.
      note: Сказать кому-то это tell. И после told время сдвигается в прошлое.
    - wrong: I will call you when I will arrive.
      right: I'll call you when I arrive.
      note: После when будущее время не ставим, хватает present simple.
    - wrong: Can you explain me this task?
      right: Can you explain this task to me?
      note: Explain не берёт человека сразу после себя, нужен предлог to.

