levels:
  - id: cosmetic
    name: Косметический
    fits: Освежить квартиру перед сдачей в аренду или продажей.
    includes:
      - Покраска стен или поклейка обоев
      - Ламинат или кварцвинил
      - Замена межкомнатных дверей
      - Новые розетки, выключатели и светильники
  - id: capital
    name: Капитальный
    fits: Вторичка с заменой всего или новостройка без отделки.
    includes:
      - Стяжка пола и штукатурка по маякам
      - Новая электрика и разводка труб
      - Санузел под ключ
      - Чистовая отделка всех комнат
  - id: design
    name: Дизайнерский
    fits: Ремонт по дизайн-проекту, где важна каждая деталь.
    includes:
      - Работа по проекту с авторским надзором
      - Многоуровневые потолки и подсветка
      - Скрытые двери и теневой профиль
      - Крупноформатная плитка и мозаика

stages:
  - title: Замер
    time: в день обращения
    text: >-
      Прораб приезжает с лазерным дальномером, смотрит стены, проводку и стояки.
      Замер бесплатный, в пригороде 1 000 ₽, их вычтем из сметы.
  - title: Смета и договор
    time: 2 дня
    text: >-
      Расписываем каждую позицию: что делаем, из чего и сколько стоит.
      Итоговая сумма попадает в договор и больше не меняется.
  - title: Черновые работы
    time: 40% срока
    text: >-
      Демонтаж, электрика, сантехника, стяжка, штукатурка. Скрытые работы
      показываем и фотографируем до того, как закроем стены.
  - title: Чистовая отделка
    time: 50% срока
    text: Плитка, полы, покраска, двери, сантехника и свет.
  - title: Сдача
    time: 1 день
    text: >-
      Уборка, проверка по чек-листу из 86 пунктов и акт приёмки.
      С этого дня идёт гарантия 3 года.

promises:
  - title: Цена в договоре
    text: Если при демонтаже найдётся гнилая проводка или кривые стены, переделываем без доплаты.
  - title: Оплата по этапам
    text: Четыре платежа, каждый после того, как вы приняли этап.
  - title: Фото каждый вечер
