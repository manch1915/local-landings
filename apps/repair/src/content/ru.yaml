faq:
  - question: Можно жить в квартире во время ремонта?
    answer: >-
      При косметическом ремонте можно, будем закрывать комнаты по очереди.
      При капитальном лучше переехать: две-три недели будет пыльно и без воды в санузле.
  - question: Кто покупает материалы?
    answer: >-
      Как вам удобнее. Черновые материалы можем закупить сами со скидкой поставщика
      10–15%, чеки прикладываем к отчёту. Плитку, ламинат и сантехнику обычно
      выбирает заказчик, мы считаем, сколько нужно купить.
  - question: Что если в процессе понадобятся дополнительные работы?
    answer: >-
      Сумма в договоре фиксированная. Она меняется, только если вы сами решите
      что-то добавить. Тогда до начала работ подписываем допсоглашение с ценой.
  - question: Как часто нужно приезжать на объект?
    answer: >-
      Только на приёмку этапов, это четыре визита за весь ремонт. В остальное время
      прораб каждый вечер присылает фото и итоги дня.
  - question: Какая гарантия?
    answer: >-
      3 года на все работы по договору. Если что-то отошло или треснуло
      по нашей вине, приезжаем в течение недели и исправляем бесплатно.
  - question: Работаете с новостройками без отделки?
    answer: >-
      Да, это примерно половина наших объектов. Можем начать в день получения
      ключей, если смета уже согласована.

