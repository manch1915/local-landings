# One server per landing on its own port. In production Caddy (or any proxy)
# maps each domain to its port; locally docker compose publishes them.

map $sent_http_content_type $cache_control {
  default                 "public, max-age=3600";
  ~text/html              "no-cache";
  ~font/                  "public, max-age=31536000, immutable";
}

map $uri $asset_cache {
  default                 $cache_control;
  ~^/_astro/              "public, max-age=31536000, immutable";
}

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
# Compress behind a proxy too: Caddy adds a Via header, and nginx skips those by default.
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

server_tokens off;

# A front proxy (Caddy on the host or in a Docker network) sits before nginx.
# Trust X-Forwarded-For only from private ranges, so $remote_addr becomes the
# visitor and the leads API rate-limits per visitor, not per proxy.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Shared settings for every site.
# - /api goes to the leads service
# - hashed assets are cached for a year, HTML is always revalidated
# - Yandex Maps loads only after a click, so the CSP allows its frame
map $host $csp {
  default "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://narcisbin.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://narcisbin.com; frame-src https://yandex.ru; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
  listen 8081;
  root /srv/repair;
  include /etc/nginx/snippets/site.conf;
}

server {
  listen 8082;
  root /srv/tutor;
  include /etc/nginx/snippets/site.conf;
}

server {
  listen 8083;
  root /srv/fitness;
  include /etc/nginx/snippets/site.conf;
}
